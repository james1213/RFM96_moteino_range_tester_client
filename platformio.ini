[env:moteino]
platform = atmelavr@^3.4.0
board = moteino
framework = arduino



upload_port = COM16
;upload_port = COM20

; Bufor odbiorczy UART. Domyslne 64 B wystarczaly przy 16-bajtowych pakietach OTA
; (linia 48 znakow miescila sie w calosci nawet gdyby petla glowna sie zaciela).
; Przy 64 B linia ma 111 znakow i mieszcza sie w niej tylko wtedy, gdy czytanie
; nadaza - 128 B przywraca margines. Koszt: +64 B RAM.
;
; -flto -Wl,--relax: ~0,5 KB flasha za darmo (optymalizacja miedzymodulowa +
; skracanie skokow przez linker). Poprawnosc sekcji .init0 (odczyt przyczyny
; resetu z r2) zweryfikowana w disasemblerze: wektor resetu -> sts resetFlags,r2.
build_flags = -DSERIAL_RX_BUFFER_SIZE=128 -flto -Wl,--relax

; Stale osloniete #ifndef w naglowkach ustawia sie stad, bez dotykania plikow
; wspoldzielonych z drugim projektem. Lokalne dla wezla, np.:
;   -DNODE_ID=3 -DTX_POWER_DBM=5 -DAPC_CEILING_DBM=9 -DLOG_ACTIVE=true
;   -DMESH_MAX_NEIGHBORS=8 -DMESH_MAX_ROUTES=24 -DTEST_SEND_INTERVAL_MS=30000
; Tablice mesh leza na stercie (MeshRouter tworzony przez new), wiec NIE widac
; ich w "RAM: used" z kompilacji. Koszt: sasiad 7 B, trasa 4 B, krawedz mapy
; 7 B, wpis dedup 2 B - po zmianie sprawdz wolny RAM w logu DIAG na plytce.
; Za duze tablice zatrzymaja kompilacje (#error), zanim beacon przepelni bufor.
;
; Parametry radia MUSZA byc identyczne na wszystkich wezlach - wezel z inna
; czestotliwoscia, SF albo BW nie slyszy reszty. Zmieniaj je w obu projektach
; naraz, liczbami calkowitymi (434000000L, nie 434E6). Powrot do zasiegu 125 kHz:
;   -DRADIO_BANDWIDTH_HZ=125000L
; Przy zmianie przez OTA najpierw najdalsze wezly, programator na koncu.
;
; Format ramki (RADIO_HEADER_SIZE, RADIO_TYPE_*, MESH_MSG_*) oslony nie ma
; celowo: musi byc taki sam na kazdym wezle, wiec zmienia sie go w naglowku.

